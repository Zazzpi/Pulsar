name: pulsar
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-pulsar}
      POSTGRES_USER: ${APP_DB_USER:-pulsar}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Run python3 scripts/setup_demo.py first}
    volumes:
      - app_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_DB_ENGINE: postgresql
      APP_DB_HOST: db
      APP_DB_PORT: '5432'
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run python3 scripts/setup_demo.py first}
    ports:
      - '127.0.0.1:${PULSAR_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  app_data:
